name: Renderer test build
on:
  push:
    branches: [renderer-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo test -p victory-shader --lib --locked
      - run: cargo test -p victory-gpu --lib --locked
      - run: cargo build --release -p victory --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ztrx-renderer-test
          path: target/release/victory.exe
          if-no-files-found: error
          retention-days: 7
